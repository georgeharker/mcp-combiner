# Per-repo policy for the vendored sharedserver resolver beside this file.
# The resolver itself is byte-identical to upstream, so drift is a plain diff.
SS_LABEL=mcp-combiner
# Floor, kept equal to the pi and OpenCode plugins' values. 0.9.6 adds the launch lock:
# concurrent `use` calls on a stopped server start exactly one and keep every ref
# (0.9.5 could start two and lose refs). Clients now respawn a dead combiner
# concurrently, so this is a capability boundary.
SS_MIN_VERSION=0.9.6
# Latest, not a pin: mcp-companion consumes sharedserver rather than shipping it, so version
# lockstep between them would be meaningless.
SS_INSTALLER_URL=https://github.com/georgeharker/sharedserver/releases/latest/download/sharedserver-installer.sh
